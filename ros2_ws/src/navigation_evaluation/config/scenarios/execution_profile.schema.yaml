$schema: https://json-schema.org/draft/2020-12/schema
title: Gazebo Execution Profile
type: object
additionalProperties: false
required:
  - profile_id
  - simulator
  - ros_distribution
  - mode
  - resource_profile
  - readiness
  - world
  - robot
  - bridge
  - known_limits
properties:
  profile_id:
    type: string
    pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
  simulator:
    const: Gazebo Harmonic
  ros_distribution:
    const: jazzy
  mode:
    enum: [server_only, headless_rendering, graphical]
  resource_profile:
    type: object
    additionalProperties: false
    required: [cpu_cores_min, memory_gb_min, disk_free_gb_min, gpu_required]
    properties:
      cpu_cores_min: {type: integer, minimum: 4}
      memory_gb_min: {type: number, minimum: 16}
      disk_free_gb_min: {type: number, minimum: 5}
      gpu_required: {type: boolean, const: false}
  readiness:
    type: object
    additionalProperties: false
    required:
      - clock_progress_timeout_s
      - startup_timeout_s
      - localization_required
      - nav2_required
      - tf_required
    properties:
      clock_progress_timeout_s: {type: number, exclusiveMinimum: 0, maximum: 20}
      startup_timeout_s: {type: number, exclusiveMinimum: 0, maximum: 120}
      localization_required: {type: boolean}
      nav2_required: {type: boolean}
      tf_required: {type: boolean}
  world:
    type: object
    required: [name, file, physics]
    properties:
      name: {type: string, minLength: 1}
      file: {type: string, minLength: 1}
      physics: {type: string, minLength: 1}
  robot:
    type: object
    required: [name, urdf, sensor_frames]
    properties:
      name: {type: string, minLength: 1}
      urdf: {type: string, minLength: 1}
      sensor_frames: {type: array, minItems: 3, items: {type: string, minLength: 1}}
  bridge:
    type: object
    required: [clock_topic, odom_topic, scan_topic, imu_topic, tf_topic]
    properties:
      clock_topic: {type: string, pattern: '^/' }
      odom_topic: {type: string, pattern: '^/' }
      scan_topic: {type: string, pattern: '^/' }
      imu_topic: {type: string, pattern: '^/' }
      tf_topic: {type: string, pattern: '^/' }
  known_limits:
    type: object
    required: [realtime_factor_not_required, visual_rendering_optional, headless_mode_available_as_override]
    properties:
      realtime_factor_not_required: {type: boolean}
      visual_rendering_optional: {type: boolean}
      headless_mode_available_as_override: {type: boolean}